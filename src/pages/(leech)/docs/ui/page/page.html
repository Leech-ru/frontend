@if (isLoading()) {
  <tui-loader />
} @else if (doc(); as doc) {
  <section class="leech-docs">
    <tui-tabs vertical="start" class="leech-docs__nav">
      @for (item of doc.navigation; track item.slug) {
        <a
          tuiTab
          type="button"
          [routerLink]="['/leech', item.slug === 'index' ? '' : item.slug]"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.slug === 'index' }"
        >
          {{ item.title }}
        </a>
      }
    </tui-tabs>
    <div class="leech-docs__content">
      <app-markdown [content]="doc.content" />
    </div>
  </section>
} @else {
  <p i18n>Документ не найден</p>
}
